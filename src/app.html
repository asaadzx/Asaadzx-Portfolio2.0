<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="author" content="Asaad Zein" />
        <meta name="robots" content="index, follow" />
        <meta name="application-name" content="Asaad Zein Portfolio" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="msapplication-TileColor" content="#161412" />
        <script>
            document.documentElement.setAttribute(
                "data-theme",
                localStorage.getItem("theme") ||
                    (matchMedia("(prefers-color-scheme:light)").matches
                        ? "light"
                        : "dark"),
            );
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Space+Mono&display=swap"
            rel="stylesheet"
        />
        <link rel="manifest" href="/manifest.json" />

        <!--umami analytics-->
        <script
            defer
            src="https://cloud.umami.is/script.js"
            data-website-id="a3007d9a-3079-419d-a69b-d09fbb27ead3"
        ></script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
